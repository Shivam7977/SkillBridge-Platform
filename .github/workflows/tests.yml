name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No database, API keys or .env needed. Only Flask.
      - run: python -m pip install flask
      - run: python -m unittest discover -s tests -t . -v
      - run: node tests/js/profile_validators.test.js